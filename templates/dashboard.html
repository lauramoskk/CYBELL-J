<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBELL-J - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body data-user="{{ username }}">
    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                CYBELL-J
            </div>
            <ul class="nav-links">
                <li>
                    <button class="nav-login-btn" onclick="window.location.href='/logout'">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Sair
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="dashboard-container">
        <div class="dashboard-card">
            <h1>Bem-vindo, {{ username }}</h1>
    
            <!-- ÁREA DE TESTE -->
            <div class="behavior-test-box">
                <textarea class="behavior-input" placeholder="Digite algo para gerar eventos de teclado"></textarea>
            </div>
        </div>
    </main>
    <script src="/static/js/script.js"></script>
    <script src="/static/js/behavior.js"></script>
</body>
</html>
